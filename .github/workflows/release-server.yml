name: Build and Release Server

# Si avvia quando crei un tag (es. v1.0.0) oppure manualmente dal bottone su GitHub
on:
  workflow_dispatch: # <-- Ti permette di avviarlo con un click dalla scheda "Actions" di GitHub
  push:
    tags:
      - 'v*'

permissions:
  contents: write # <-- Fondamentale: dà il permesso all'Action di caricare file nel tuo repo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Scarica il tuo repository
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Installa Rust sul server di GitHub
      - name: Installa Rust
        uses: dtolnay/rust-toolchain@stable

      # 3. Compila mistralrs-cli
      - name: Compila mistralrs
        run: |
          cargo install mistralrs-cli
          strip ~/.cargo/bin/mistralrs
          cp ~/.cargo/bin/mistralrs ./mistralrs

      # 4. Crea (o aggiorna) la Release sul tuo repo e carica il binario
      - name: Carica binario nelle Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Prebuilt Server Binaries"
          files: ./mistralrs
